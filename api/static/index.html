<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>취재를 종합하면</title>
  <meta name="description" content="한국 언론의 기사에서 '취재를 종합하면' 표현의 사용을 기록하는 대시보드" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <h1>취재를 종합하면</h1>
        <p id="heroDescription"></p>
        <div id="collectionHealth" class="collection-health" aria-live="polite">최근 수집 상태 확인 중…</div>
      </div>
      <label class="date-box">
        <span>기준일</span>
        <input id="dateInput" type="date" />
      </label>
    </header>

    <section class="cards" id="summaryCards"></section>

    <section class="grid two">
      <article class="panel">
        <div class="panel-head">
          <h2 id="publisherTitle"></h2>
          <button class="text-link rank-toggle" data-target="publisherRanking" type="button"></button>
        </div>
        <div id="publisherRanking" class="ranking"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 id="reporterTitle"></h2>
            <span id="weekLabel"></span>
          </div>
          <button class="text-link rank-toggle" data-target="reporterRanking" type="button"></button>
        </div>
        <div id="reporterRanking" class="ranking"></div>
      </article>
    </section>

    <section class="grid two">
      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 id="categoryTitle"></h2>
            <span id="categoryCoverage">AI 주제 분류</span>
          </div>
          <button class="text-link rank-toggle" data-target="categoryRanking" type="button"></button>
        </div>
        <div id="categoryRanking" class="ranking"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 id="secondaryTitle"></h2>
            <span>해당 기사 본문 기준</span>
          </div>
          <button class="text-link rank-toggle" data-target="secondaryRanking" type="button"></button>
        </div>
        <div id="secondaryRanking" class="ranking"></div>
      </article>
    </section>

    <section class="panel history">
      <div class="panel-head">
        <h2 id="historyTitle"></h2>
      </div>
      <div id="historyBars" class="history-bars"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="articlesTitle"></h2>
        <div class="article-head-actions"><span id="articleCount"></span><button class="text-link" type="button" id="clearTopicFilter" hidden>주제 필터 해제</button></div>
      </div>
      <div id="articleList" class="articles"></div>
      <div class="more-wrap">
        <button id="loadMore" class="more-button" type="button"></button>
      </div>
    </section>
  </main>

  <template id="articleTemplate">
    <article class="news-item">
      <div class="news-meta"></div>
      <h3></h3>
      <p class="context"></p>
      <div class="chips"></div>
      <details class="paragraph-details">
        <summary></summary>
        <p class="paragraph"></p>
      </details>
      <details class="topic-details" hidden>
        <summary>주제 분류 자세히</summary>
        <div class="topic-detail-body">
          <div class="topic-path"></div>
          <div class="topic-tags"></div>
          <div class="topic-original"></div>
        </div>
      </details>
      <div class="links"></div>
    </article>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
