<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>취재를 종합하면</title>
  <meta name="description" content="한국 언론의 기사에서 '취재를 종합하면' 표현의 사용을 기록하는 대시보드" />
  <link rel="canonical" href="https://based-on-our-reporting.com/" />
  <!-- Open Graph: read by KakaoTalk, Facebook and most link-preview crawlers. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="취재를 종합하면" />
  <meta property="og:title" content="취재를 종합하면" />
  <meta property="og:description" content="한국 언론의 기사에서 '취재를 종합하면' 표현의 사용을 기록하는 대시보드" />
  <meta property="og:url" content="https://based-on-our-reporting.com/" />
  <meta property="og:image" content="https://based-on-our-reporting.com/static/og-thumbnail-wide.jpg" />
  <meta property="og:image:secure_url" content="https://based-on-our-reporting.com/static/og-thumbnail-wide.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="취재를 종합하면 대시보드 공유 썸네일" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="취재를 종합하면" />
  <meta name="twitter:description" content="한국 언론의 취재 표현 사용 현황을 기록하는 대시보드" />
  <meta name="twitter:image" content="https://based-on-our-reporting.com/static/og-thumbnail-wide.jpg" />
  <link rel="stylesheet" href="/static/style.css?v=analysis-visual-1" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <h1>취재를 종합하면</h1>
        <div class="hero-intro"><p id="heroDescription"></p><a href="/about" class="about-link">자세히 보기 <span aria-hidden="true">↗</span></a></div>
        <div id="collectionHealth" class="collection-health" aria-live="polite">최근 수집 상태 확인 중…</div>
      </div>
      <label class="date-box">
        <span>기준일</span>
        <input id="dateInput" type="date" />
      </label>
    </header>

    <section class="cards" id="summaryCards"></section>

    <section class="dashboard-group usage-group" aria-labelledby="usageGroupTitle">
      <div class="group-heading"><h2 id="usageGroupTitle"></h2></div>
      <div class="grid two">
      <article class="panel">
        <div class="panel-head">
          <h2 id="publisherTitle"></h2>
          <button class="text-link rank-toggle" data-target="publisherRanking" type="button" aria-haspopup="dialog" aria-controls="rankingDialog"></button>
        </div>
        <div id="publisherRanking" class="ranking"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 id="reporterTitle"></h2>
            <span id="weekLabel"></span>
          </div>
          <button class="text-link rank-toggle" data-target="reporterRanking" type="button" aria-haspopup="dialog" aria-controls="rankingDialog"></button>
        </div>
        <div id="reporterRanking" class="ranking"></div>
      </article>
      </div>
    </section>

    <section class="dashboard-group analysis-group" aria-labelledby="analysisGroupTitle">
      <div class="group-heading"><h2 id="analysisGroupTitle"></h2></div>
      <div class="analysis-stack">
      <article class="panel category-panel">
        <div class="panel-head">
          <h2 id="categoryTitle"></h2>
          <button class="text-link rank-toggle" data-target="categoryRanking" type="button" aria-haspopup="dialog" aria-controls="categoryDialog">자세히 보기</button>
        </div>
        <div id="categoryRanking" class="topic-overview">
          <div class="topic-overview-primary">
            <h3 id="topicPrimaryCaption"></h3>
            <div id="topicPrimaryPie" class="topic-overview-pie"></div>
          </div>
          <div class="topic-overview-secondary">
            <h3 id="topicSecondaryCaption"></h3>
            <div id="topicSecondaryBars" class="topic-overview-bars"></div>
          </div>
        </div>
      </article>

      <article class="panel expression-panel">
        <div class="panel-head">
          <div>
            <h2 id="secondaryTitle"></h2>
            <span>해당 기사 본문 기준</span>
          </div>
          <button class="text-link rank-toggle" data-target="secondaryRanking" type="button" aria-haspopup="dialog" aria-controls="rankingDialog"></button>
        </div>
        <div id="secondaryRanking" class="expression-chart"></div>
      </article>
      </div>
    </section>

    <section class="panel history">
      <div class="panel-head">
        <h2 id="historyTitle"></h2>
      </div>
      <div id="historyBars" class="history-bars"></div>
    </section>

    <section class="panel articles-panel">
      <div class="panel-head">
        <h2 id="articlesTitle"></h2>
        <div class="article-head-actions"><span id="articleCount"></span><button class="text-link" type="button" id="clearTopicFilter" hidden>주제 필터 해제</button></div>
      </div>
      <div id="articleList" class="articles"></div>
      <div class="more-wrap">
        <button id="loadMore" class="more-button" type="button"></button>
      </div>
    </section>
    <dialog class="topic-dialog" id="categoryDialog" aria-labelledby="categoryDialogTitle">
      <header class="topic-dialog-head">
        <h2 id="categoryDialogTitle">기사 분류별 비중</h2>
        <button type="button" id="closeCategoryDialog" aria-label="팝업 닫기">✕</button>
      </header>
      <div id="categoryDialogContent"></div>
    </dialog>
    <dialog class="ranking-dialog" id="rankingDialog" aria-labelledby="rankingDialogTitle">
      <header class="topic-dialog-head">
        <h2 id="rankingDialogTitle"></h2>
        <button type="button" id="closeRankingDialog" aria-label="팝업 닫기">✕</button>
      </header>
      <div id="rankingDialogContent"></div>
      <div class="more-wrap ranking-dialog-more-wrap">
        <button id="rankingDialogMore" class="more-button" type="button" hidden></button>
      </div>
    </dialog>
  </main>

  <template id="articleTemplate">
    <article class="news-item">
      <div class="news-meta"></div>
      <h3></h3>
      <p class="context"></p>
      <details class="paragraph-details">
        <summary></summary>
        <p class="paragraph"></p>
      </details>
      <div class="links"></div>
    </article>
  </template>

  <script src="/static/app.js?v=analysis-visual-2" defer></script>
  <script src="/static/topic-dialog.js?v=analysis-visual-2" defer></script>
  <script src="/static/ranking-dialog.js?v=ranking-details-1" defer></script>
</body>
</html>
