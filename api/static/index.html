<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>취재를 종합하면</title>
  <meta name="description" content="한국 온라인 기사에서 '취재를 종합하면' 표현의 사용을 기록하는 대시보드" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <div class="eyebrow">월간 송개발 #05</div>
        <h1>취재를 종합하면</h1>
        <p>한국 온라인 기사에서 <strong>“취재를 종합하면”</strong>이 어떻게 쓰이는지 기록합니다.</p>
      </div>
      <label class="date-box">
        <span>기준일</span>
        <input id="dateInput" type="date" />
      </label>
    </header>

    <section class="cards" id="summaryCards"></section>

    <section class="grid two">
      <article class="panel">
        <div class="panel-head">
          <h2>오늘의 최다 취재 종합 언론사</h2>
          <span>상위 10개</span>
        </div>
        <div id="publisherRanking" class="ranking"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>이번 주 가장 많이 취재 종합한 기자</h2>
          <span id="weekLabel"></span>
        </div>
        <div id="reporterRanking" class="ranking"></div>
      </article>
    </section>

    <section class="grid two">
      <article class="panel">
        <div class="panel-head">
          <h2>원문 기사 분류</h2>
          <span>언론사 표기 기준</span>
        </div>
        <div id="categoryRanking" class="ranking"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>함께 쓰인 무주체형 표현</h2>
          <span>해당 기사 본문 기준</span>
        </div>
        <div id="secondaryRanking" class="ranking"></div>
      </article>
    </section>

    <section class="panel history">
      <div class="panel-head">
        <h2>최근 14일</h2>
        <span>데이터가 쌓이는 대로 채워집니다</span>
      </div>
      <div id="historyBars" class="history-bars"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>오늘의 기사</h2>
        <span id="articleCount"></span>
      </div>
      <div id="articleList" class="articles"></div>
    </section>

    <footer>
      <p id="methodology"></p>
      <p class="muted">현재 주제 분류는 언론사 원문 카테고리를 참고값으로만 표시합니다. 자체 표준 분류는 추후 적용합니다.</p>
    </footer>
  </main>

  <template id="articleTemplate">
    <article class="news-item">
      <div class="news-meta"></div>
      <h3></h3>
      <p class="context"></p>
      <div class="chips"></div>
      <details>
        <summary>문단 보기</summary>
        <p class="paragraph"></p>
      </details>
      <div class="links"></div>
    </article>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
