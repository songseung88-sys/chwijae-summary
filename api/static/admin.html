<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문구 편집 · 취재를 종합하면</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/admin.css?v=publisher-aliases-1" />
</head>
<body>
  <main class="admin-wrap">
    <header>
      <h1>문구 편집</h1>
      <p>공개 화면의 제목과 안내 문구를 수정합니다. 저장하면 즉시 반영됩니다.</p>
    </header>
    <section class="panel admin-panel">
      <label class="admin-password">관리자 비밀번호
        <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" />
      </label>
      <form id="configForm"></form>
      <div class="admin-actions">
        <button id="saveButton" class="save-button" type="button">저장</button>
        <a href="/" target="_blank" rel="noopener noreferrer">공개 화면 보기</a>
        <a href="/about" target="_blank" rel="noopener noreferrer">자세히 보기 페이지</a>
        <span id="status"></span>
      </div>
    </section>
    <section class="panel admin-panel" id="publisherNameEditor" aria-labelledby="publisherEditorTitle">
      <h2 id="publisherEditorTitle">언론사 노출 이름 수정</h2>
      <p class="publisher-editor-help">수집된 언론사 목록을 불러와 표시 이름을 고칠 수 있습니다. 기사 원문과 저장된 언론사명은 바뀌지 않습니다. 같은 표시 이름으로 수정하면 순위에서는 합산됩니다.</p>
      <div class="publisher-editor-tools">
        <button id="loadPublishers" class="save-button" type="button">언론사 목록 불러오기</button>
        <label for="publisherSearch">언론사 검색
          <input id="publisherSearch" type="search" placeholder="예: KBS 뉴스, KBS" disabled />
        </label>
      </div>
      <p id="publisherEditorSummary" class="publisher-editor-summary" aria-live="polite">관리자 비밀번호를 입력하고 목록을 불러오세요.</p>
      <div class="publisher-table-scroll">
        <table class="publisher-table">
          <thead><tr><th scope="col">수집된 이름</th><th scope="col">표시할 이름</th><th scope="col">기사 수</th><th scope="col">초기화</th></tr></thead>
          <tbody id="publisherRows"></tbody>
        </table>
      </div>
      <div class="publisher-editor-actions">
        <button id="publisherLoadMore" class="publisher-secondary-button" type="button" hidden>더 보기</button>
        <button id="savePublishers" class="save-button" type="button" disabled>변경사항 저장</button>
        <span id="publisherEditorStatus" role="status"></span>
      </div>
    </section>
  </main>
  <script src="/static/admin.js?v=publisher-aliases-1" defer></script>
  <script src="/static/publisher-editor.js?v=publisher-aliases-1" defer></script>
</body>
</html>
