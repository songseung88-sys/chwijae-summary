<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자세히 보기 | 취재를 종합하면</title>
  <meta name="description" content="취재를 종합하면 대시보드 소개" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/bigkinds-charts.css?v=2" />
</head>
<body>
  <main class="wrap about-page">
    <a class="about-back" href="/">← 대시보드로 돌아가기</a>
    <h1>자세히 보기</h1>
    <section class="bigkinds-history" aria-labelledby="bigkindsHistoryTitle">
      <header class="bigkinds-heading">
        <h2 id="bigkindsHistoryTitle">‘취재를 종합하면’ 10년의 기록</h2>
        <p>빅카인즈에서 조사한 10개 언론사의 연도별 기사 수입니다.</p>
      </header>
      <div id="aboutLayout">
        <section id="aboutContent" class="about-text-block" aria-label="서비스 소개 본문" hidden></section>
        <article id="bigkindsAnnualSection" class="bigkinds-panel" aria-labelledby="bigkindsAnnualTitle">
          <div class="bigkinds-panel-header">
            <div>
              <h3 id="bigkindsAnnualTitle">‘취재를 종합하면’ 연간 기사 수</h3>
              <p>10개 언론사 합계 · 연도별 검색 기사 수</p>
            </div>
          </div>
          <div class="bigkinds-chart-shell" id="bigkindsAnnualChart" aria-label="연간 기사 수 그래프"></div>
        </article>
        <article id="bigkindsPublisherSection" class="bigkinds-panel" aria-labelledby="bigkindsPublisherTitle">
          <div class="bigkinds-panel-header">
            <div><h3 id="bigkindsPublisherTitle">언론사별 ‘취재를 종합하면’ 사용 추이</h3></div>
          </div>
          <div id="bigkindsPublisherFilters" class="bigkinds-publisher-filters" role="group" aria-label="그래프에 표시할 언론사 선택"></div>
          <p id="bigkindsSelectedCount" class="bigkinds-selection-note" aria-live="polite"></p>
          <div class="bigkinds-chart-shell" id="bigkindsPublisherChart" aria-label="선택한 언론사들의 연도별 기사 수 추이 그래프"></div>
        </article>
      </div>
      <p id="aboutLoadError" class="about-load-error" hidden>소개글을 불러오지 못했습니다.</p>
    </section>
  </main>
  <script src="/static/about.js?v=2" defer></script>
  <script src="/static/bigkinds-charts.js?v=2" defer></script>
</body>
</html>
