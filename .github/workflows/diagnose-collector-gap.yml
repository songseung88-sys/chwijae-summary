name: Diagnose 2026-11-14 Cloud Scheduler collector gap (read-only)

on:
  push:
    branches:
      - diag/collector-gap-20261114
    paths:
      - qa/diagnose_collector_nov14.py
      - .github/workflows/diagnose-collector-gap.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: chwijae-summary
          workload_identity_provider: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary
          service_account: github-deployer@chwijae-summary.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read existing Cloud Scheduler and Cloud Run histories
        run: python qa/diagnose_collector_nov14.py
