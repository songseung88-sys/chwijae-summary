name: Verify Google Sheets archive log sync

on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-archive-write.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: chwijae-summary
          workload_identity_provider: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary
          service_account: github-deployer@chwijae-summary.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Sync last two days of 30-minute collection logs
        run: |
          gcloud run jobs execute chwijae-daily-archive \
            --project=chwijae-summary --region=asia-northeast3 \
            --args="--mode,logs,--days,2" \
            --wait --quiet
      - name: Check collector runs are separately archived
        run: |
          curl --retry 4 --retry-delay 2 --fail --silent --show-error \
            https://chwijae-api-ejmdmrnztq-du.a.run.app/api/archive-sync-status
          echo
