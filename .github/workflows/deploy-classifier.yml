name: Deploy classifier test

on:
  push:
    branches:
      - main
    paths:
      - "classifier/**"
      - ".github/workflows/deploy-classifier.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chwijae-classifier-test
  cancel-in-progress: false

env:
  PROJECT_ID: chwijae-summary
  REGION: asia-northeast3
  ARTIFACT_REPO: chwijae
  JOB_NAME: chwijae-classifier-test
  RUNTIME_SA: collector-runtime@chwijae-summary.iam.gserviceaccount.com
  DEPLOY_SA: github-deployer@chwijae-summary.iam.gserviceaccount.com
  WIF_PROVIDER: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push classifier image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/classifier:${{ github.sha }}
        run: |
          docker build -t "${IMAGE}" ./classifier
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy and run classifier test
        run: |
          gcloud run jobs deploy "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --cpu=1 \
            --memory=512Mi \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=20m \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},OPENAI_MODEL=gpt-6-luna,CLASSIFY_LIMIT=100,CLASSIFY_FORCE=false" \
            --set-secrets="OPENAI_API_KEY=openai-api-key:latest" \
            --execute-now \
            --wait

      - name: Print classifier run summary
        run: |
          URL="$(gcloud run services describe "chwijae-api" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "API_URL=${URL}"
          echo "STATUS:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/status"
          echo
