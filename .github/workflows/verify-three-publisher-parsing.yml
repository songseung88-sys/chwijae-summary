name: Verify three publisher article body parsers (read-only)

on:
  push:
    branches: [fix/three-publisher-body-extraction-20261120]
    paths:
      - collector/main.py
      - qa/verify_three_publishers_live.py
      - .github/workflows/verify-three-publisher-parsing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r collector/requirements.txt
      - name: Test actual official publisher articles with updated production parser
        run: python -m qa.verify_three_publishers_live
