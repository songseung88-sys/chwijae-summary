name: Deploy collector

on:
  push:
    branches:
      - main
    paths:
      - "collector/**"
      - ".github/workflows/deploy-collector.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: chwijae-summary
  PROJECT_NUMBER: "761297976744"
  REGION: asia-northeast3
  ARTIFACT_REPO: chwijae
  JOB_NAME: chwijae-collector
  RUNTIME_SA: collector-runtime@chwijae-summary.iam.gserviceaccount.com
  DEPLOY_SA: github-deployer@chwijae-summary.iam.gserviceaccount.com
  WIF_PROVIDER: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push collector image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/collector:${{ github.sha }}
        run: |
          docker build -t "${IMAGE}" ./collector
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy Cloud Run Job and run first collection
        run: |
          gcloud run jobs deploy "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --cpu=1 \
            --memory=512Mi \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},COMPARE_NAVER=true,MAX_ARTICLES_PER_RUN=100" \
            --set-secrets="NAVER_API_HUB_CLIENT_ID=naver-api-client-id:1,NAVER_API_HUB_CLIENT_SECRET=naver-api-client-secret:1" \
            --execute-now \
            --wait
