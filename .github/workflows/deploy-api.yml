name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: chwijae-summary
  REGION: asia-northeast3
  ARTIFACT_REPO: chwijae
  SERVICE_NAME: chwijae-api
  RUNTIME_SA: collector-runtime@chwijae-summary.iam.gserviceaccount.com
  DEPLOY_SA: github-deployer@chwijae-summary.iam.gserviceaccount.com
  WIF_PROVIDER: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}
        run: |
          docker build -t "${IMAGE}" ./api
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy public read-only API
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --cpu=1 \
            --memory=256Mi \
            --min=0 \
            --max=2 \
            --concurrency=20 \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID}" \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test API and print collector diagnostics
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "API_URL=${URL}"
          echo "HEALTH_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/health"
          echo
          echo "STATUS_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/status"
          echo
          echo "DIAGNOSTICS_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/diagnostics"
          echo
          echo "### API URL" >> "${GITHUB_STEP_SUMMARY}"
          echo "${URL}" >> "${GITHUB_STEP_SUMMARY}"
