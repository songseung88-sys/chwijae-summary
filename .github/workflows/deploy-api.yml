name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chwijae-api-deploy
  cancel-in-progress: true

env:
  PROJECT_ID: chwijae-summary
  REGION: asia-northeast3
  ARTIFACT_REPO: chwijae
  SERVICE_NAME: chwijae-api
  RUNTIME_SA: collector-runtime@chwijae-summary.iam.gserviceaccount.com
  DEPLOY_SA: github-deployer@chwijae-summary.iam.gserviceaccount.com
  WIF_PROVIDER: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}
        run: |
          docker build -t "${IMAGE}" ./api
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Validate API image
        run: |
          docker run --rm --entrypoint python "${IMAGE}" -m py_compile /app/main.py /app/feedback_store.py
          # Catch ASGI route-registration and import errors before Cloud Run revision rollout.
          docker run --rm --entrypoint python "${IMAGE}" -c 'import google.cloud.firestore as f; f.Client=lambda **kwargs: object(); import main; print("APP_IMPORT_AND_ROUTES_OK")'
          docker run --rm --entrypoint sh "${IMAGE}" -c 'test -f /app/static/index.html && test -f /app/static/app.js && test -f /app/static/style.css && test -f /app/static/admin.html && test -f /app/static/admin.js && test -s /app/static/og-thumbnail-wide.jpg'

      - name: Detect optional admin editor secret
        run: |
          if gcloud secrets describe "admin-editor-password" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "ADMIN_SECRET_FLAG=--set-secrets=ADMIN_EDITOR_PASSWORD=admin-editor-password:latest" >> "${GITHUB_ENV}"
          else
            echo "ADMIN_SECRET_FLAG=" >> "${GITHUB_ENV}"
          fi

      - name: Deploy public read-only API
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --cpu=1 \
            --memory=256Mi \
            --min=0 \
            --max=2 \
            --concurrency=20 \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID}" \
            ${ADMIN_SECRET_FLAG} \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test API and dashboard
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "API_URL=${URL}"
          echo "HEALTH_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/health"
          echo
          echo "DASHBOARD_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/dashboard"
          echo
          echo "DIAGNOSTICS_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/diagnostics"
          echo
          echo "CLASSIFICATION_TEST_JSON:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/classification-test"
          echo
          echo "DASHBOARD_HTML_STATUS:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error -o /tmp/dashboard.html -w "%{http_code}\n" "${URL}/"
          grep -q "취재를 종합하면" /tmp/dashboard.html
          echo "SOCIAL_SHARE_IMAGE_CHECK:"
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re
          class OgParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags={}
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag == "meta":
                      k=attrs.get("property") or attrs.get("name")
                      if k:
                          self.tags[k]=attrs.get("content","")
          parser=OgParser()
          html=Path("/tmp/dashboard.html").read_text(encoding="utf-8")
          parser.feed(html)
          root="https://based-on-our-reporting.com/"
          image_url=parser.tags["og:image"]
          # Shared preview title/description may be customized by the admin.
          assert 0<=len(parser.tags["og:title"])<=100
          assert 0<=len(parser.tags["og:description"])<=300
          assert parser.tags["twitter:title"]==parser.tags["og:title"]
          assert parser.tags["twitter:description"]==parser.tags["og:description"]
          assert parser.tags["description"]==parser.tags["og:description"]
          assert parser.tags["og:url"]==root
          # The thumbnail is editable in /admin. Allow the bundled image or
          # a Firestore-backed immutable version; do not demand a fixed URL.
          assert image_url==root+"static/og-thumbnail-wide.jpg" or re.fullmatch(
              re.escape(root)+r"share-images/[a-f0-9]{64}\.jpg",image_url
          ),image_url
          assert parser.tags["og:image:secure_url"]==image_url
          assert parser.tags["twitter:image"]==image_url
          assert parser.tags["og:image:width"]=="1200" and parser.tags["og:image:height"]=="630"
          assert parser.tags["twitter:card"]=="summary_large_image"
          with urlopen(Request(image_url,headers={"User-Agent":"Dashboard-Deploy-Smoke"}),timeout=30) as response:
              img=response.read()
              media_type=response.headers.get("Content-Type","")
          assert "image/jpeg" in media_type, media_type
          assert len(img)>1000 and img[:3]==bytes((255,216,255))
          print("SOCIAL_SHARE_PREVIEW_VALIDATED",len(img),image_url)
          PY
          echo "ANALYSIS_CHARTS_CHECK:"
          grep -q 'id="topicPrimaryPie"' /tmp/dashboard.html
          grep -q 'id="topicSecondaryBars"' /tmp/dashboard.html
          grep -q 'id="secondaryRanking"' /tmp/dashboard.html
          grep -q 'id="targetPhraseDialog"' /tmp/dashboard.html
          grep -q '/static/target-phrase-dialog.js?v=2' /tmp/dashboard.html
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/target-phrase-dialog.js?v=2" -o /tmp/target-detail.js
          grep -q 'function targetPhraseDetailMarkup' /tmp/target-detail.js
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/app.js?v=target-phrase-v2" -o /tmp/analysis-app.js
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/topic-dialog.js?v=analysis-visual-1" -o /tmp/analysis-pie.js
          grep -q 'function renderTopicOverview' /tmp/analysis-app.js
          grep -q 'function renderExpressionChart' /tmp/analysis-app.js
          grep -q 'function labeledPieSvg' /tmp/analysis-pie.js
          echo "ANALYSIS_CHARTS_ASSETS_VALIDATED"
          echo "BIGKINDS_ABOUT_CHARTS_CHECK:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/about" -o /tmp/about.html
          grep -q 'id="bigkindsAnnualChart"' /tmp/about.html
          if grep -q '<h1>자세히 보기</h1>' /tmp/about.html; then
            echo "Redundant About page heading must be removed"; exit 1
          fi
          grep -q '/static/about.js?v=4' /tmp/about.html
          grep -q '/static/bigkinds-charts.css?v=7' /tmp/about.html
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/bigkinds-charts.css?v=7" -o /tmp/about-charts.css
          grep -Fq '.feedback-section details[open] summary > span[aria-hidden="true"]{transform:rotate(180deg)}' /tmp/about-charts.css
          grep -Fq '.feedback-section summary #feedbackSummaryLabel{font-size:14px' /tmp/about-charts.css
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/admin" -o /tmp/format-admin.html
          grep -q '/static/about-format.js?v=1' /tmp/format-admin.html
          grep -q '/static/about-layout-editor.js?v=per-item-save-1' /tmp/format-admin.html
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/about-format.js?v=1" -o /tmp/about-format.js
          grep -q 'function toggleAboutFormatting' /tmp/about-format.js
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/about.js?v=4" -o /tmp/about-lead.js
          grep -q 'about-lead-phrase' /tmp/about-lead.js
          grep -q 'id="bigkindsPublisherChart"' /tmp/about.html
          grep -q 'feedback-chevron' /tmp/about.html
          grep -q '▼' /tmp/about.html
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/bigkinds-annual-2016-2025.json" -o /tmp/bigkinds.json
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/bigkinds-charts.js?v=4" -o /tmp/bigkinds-charts.js
          grep -q 'fetch("/api/bigkinds-history"' /tmp/bigkinds-charts.js
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/api/bigkinds-history" -o /tmp/bigkinds-live.json
          grep -q 'function annualBigkindsSvg' /tmp/bigkinds-charts.js
          grep -q 'BIGKINDS_MOBILE_PLOT' /tmp/bigkinds-charts.js
          grep -q 'bigkindsMobileView' /tmp/bigkinds-charts.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/bigkinds.json').read_text())
          assert d['years']==list(range(2016,2026))
          assert d['totals'][-1]==4391
          assert len(d['publishers'])==10
          assert all(sum(v[i] for v in d['publishers'].values())==d['totals'][i] for i in range(10))
          live=json.loads(Path('/tmp/bigkinds-live.json').read_text())
          assert live['years']==d['years'] and set(live['publishers'])==set(d['publishers'])
          assert all(sum(v[i] for v in live['publishers'].values())==live['totals'][i] for i in range(10))
          print('BIGKINDS_HISTORICAL_DATA_AND_CHARTS_OK')
          PY

          echo "FEEDBACK_UI_AND_API_CHECK:"
          grep -q 'id="feedbackDisclosure"' /tmp/about.html
          grep -q 'id="feedbackForm"' /tmp/about.html
          grep -q 'id="feedbackSubmit"' /tmp/about.html
          if grep -q '‘취재를 종합하면’ 10년의 기록' /tmp/about.html; then
            echo "Old history heading still present"; exit 1
          fi
          curl --retry 4 --retry-delay 2 --fail --silent --show-error "${URL}/static/feedback.js?v=1" -o /tmp/feedback.js
          grep -q 'function submitFeedback' /tmp/feedback.js
          INVALID_STATUS="$(curl --silent --show-error -o /tmp/invalid-feedback.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"message":"x","submission_id":"00000000-0000-4000-8000-000000000000"}' "${URL}/api/feedback")"
          test "$INVALID_STATUS" = 400
          echo "FEEDBACK_PUBLIC_VALIDATION_OK"
          echo "ADMIN_THUMBNAIL_UI_CHECK:"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/admin" -o /tmp/admin.html
          grep -q '/static/admin.js?v=per-item-save-1' /tmp/admin.html
          grep -q '/static/publisher-editor.js?v=per-item-save-1' /tmp/admin.html
          grep -q '/static/bigkinds-data-editor.js?v=per-item-save-1' /tmp/admin.html
          grep -q '/static/about-layout-editor.js?v=per-item-save-1' /tmp/admin.html
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/admin.js?v=per-item-save-1" -o /tmp/admin-individual.js
          grep -q 'function saveCopyField' /tmp/admin-individual.js
          INVALID_SINGLE_STATUS="$(curl -sS -o /tmp/unauthorized-about-block.json -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' --data '{"index":0,"expected_text":"x","text":"y"}' "${URL}/api/admin/about-block")"
          test "$INVALID_SINGLE_STATUS" = 401
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${URL}/static/thumbnail-editor.js?v=1" -o /tmp/thumbnail-editor.js
          grep -q 'id="thumbnailFile"' /tmp/admin.html
          grep -q 'id="thumbnailSave"' /tmp/admin.html
          grep -q 'id="thumbnailMetaTitle"' /tmp/admin.html
          grep -q 'id="thumbnailMetaDescription"' /tmp/admin.html
          grep -q 'id="thumbnailMetaSave"' /tmp/admin.html
          grep -q '/api/admin/thumbnail/metadata' /tmp/thumbnail-editor.js
          grep -q '/api/admin/thumbnail' /tmp/thumbnail-editor.js
          CODE="$(curl --silent --show-error -o /tmp/unauthorized.json -w '%{http_code}' "${URL}/api/admin/thumbnail")"
          test "${CODE}" = "401"
          META_CODE="$(curl --silent --show-error -o /tmp/metadata-unauthorized.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            --data '{"title":"unauthorized","description":"unauthorized"}' "${URL}/api/admin/thumbnail/metadata")"
          test "${META_CODE}" = "401"
          echo "ADMIN_LAYOUT_AND_BIGKINDS_AUTH_CHECK:"
          grep -q 'id="aboutLayoutRows"' /tmp/admin.html
          grep -q 'id="bigkindsEditorBody"' /tmp/admin.html
          for API_PATH in /api/admin/about-layout /api/admin/bigkinds-history; do
            HTTP_CODE="$(curl -sS -o /tmp/admin-api-response -w '%{http_code}' -X PUT -H 'Content-Type: application/json' --data '{}' "${URL}${API_PATH}")"
            test "$HTTP_CODE" = 401
          done
          echo "ADMIN_LAYOUT_AND_BIGKINDS_AUTH_REQUIRED"
          echo "ADMIN_THUMBNAIL_AUTH_REQUIRED"
          echo "### Dashboard" >> "${GITHUB_STEP_SUMMARY}"
          echo "${URL}" >> "${GITHUB_STEP_SUMMARY}"
