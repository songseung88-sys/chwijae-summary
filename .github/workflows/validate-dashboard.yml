name: Validate dashboard changes

on:
  push:
    branches:
      - main
      - feature/dashboard-topic-classification
      - feature/collection-reliability-display
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "collector/**"
      - "infra/**"
      - "qa/**"
      - ".github/workflows/run-classifier.yml"
      - ".github/workflows/validate-dashboard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python compile
        run: python -m py_compile api/main.py classifier/main.py collector/main.py
      - name: Verify social sharing Open Graph tags and thumbnail image
        run: python -m unittest discover -s qa -p "test_social_preview.py" -v
      - name: Verify password-protected image upload and crawler metadata rendering
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python -m unittest discover -s qa -p "test_admin_thumbnail.py" -v
          node --check api/static/thumbnail-editor.js
          python - <<'PY'
          from pathlib import Path
          html=Path("api/static/admin.html").read_text()
          for x in ("thumbnailEditor","thumbnailFile","thumbnailPreview","thumbnailLoad","thumbnailSave","thumbnailReset"):
              assert ('id="'+x+'"') in html,x
          assert "thumbnail-editor.js" in html
          print("Admin thumbnail page wiring validated")
          PY
      - name: Archive exporter syntax and idempotency regression
        run: |
          python -m py_compile archive/main.py collector/main.py
          python -m unittest discover -s qa -p "test_daily_archive.py" -v
          python - <<'PY'
          from pathlib import Path
          archive=Path("archive/main.py").read_text()
          workflow=Path(".github/workflows/run-daily-archive.yml").read_text()
          collector=Path("collector/main.py").read_text()
          assert '"domain_diagnostics": {}' in collector
          assert 'domain_stats["rejected"]' in collector
          assert '13 17 * * *' in workflow
          assert '16,46 * * * *' in workflow
          assert 'MAX_ARCHIVE_BODY_FETCH' in archive
          assert 'def archive_body(' in archive
          assert 'src=basename' in archive
          print("Archive scheduling and per-domain diagnostics contract passed")
          PY
      - name: Publisher and scheduler regression checks
        run: |
          python -m pip install --quiet beautifulsoup4
          python -m unittest discover -s qa -p "test_publisher_normalization.py" -v
          python -m unittest discover -s qa -p "test_publisher_alias_admin.py" -v
          python -m unittest discover -s qa -p "test_subjectless_table3.py" -v
          python -m unittest discover -s qa -p "test_expanded_corpus.py" -v
          python -m unittest discover -s qa -p "test_article_body_extraction.py" -v
          bash -n infra/setup_scheduler.sh
      - name: JavaScript syntax check
        run: node --check api/static/app.js && node --check api/static/admin.js && node --check api/static/about.js && node --check api/static/topic-dialog.js && node --check api/static/ranking-dialog.js && node --check api/static/publisher-editor.js
      - name: Verify pie labels and small-slice leader lines
        run: |
          node - <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const ctx={esc:s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;")};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("api/static/topic-dialog.js","utf8"),ctx);
          const graph=vm.runInContext('labeledPieSvg([{name:"사회",count:7},{name:"경제·산업",count:6},{name:"정치",count:5},{name:"스포츠",count:1},{name:"문화·생활",count:1}],20)',ctx);
          assert.match(graph,/>사회<\/text>/);
          assert.match(graph,/>정치<\/text>/);
          assert.match(graph,/>스포츠<\/text>/);
          assert.match(graph,/<polyline /);
          assert.match(graph,/role="img"/);
          assert.match(graph,/#[0-9A-Fa-f]{6}/);
          console.log("Colorful labeled SVG chart and leader-line checks passed");
          JS
      - name: Verify editorial hierarchy and admin-editable copy
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import ast
          main = Path("api/main.py").read_text()
          tree = ast.parse(main)
          config_node = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id=="DEFAULT_SITE_CONFIG" for t in n.targets))
          cfg=ast.literal_eval(config_node.value)
          admin=Path("api/static/admin.js").read_text()
          html=Path("api/static/index.html").read_text()
          css=Path("api/static/style.css").read_text()
          js=Path("api/static/app.js").read_text()
          # All existing titles are preserved byte-for-byte in the source defaults.
          expected={
              "card_today_label":"오늘의 '취재 종합'",
              "card_publisher_label":"오늘의 최다 '취재 종합' 언론사",
              "card_reporter_label":"이번 주 가장 많이 '취재 종합'한 기자",
              "card_exclusive_label":"[단독] 동반 비율",
              "section_publisher_title":"오늘의 최다 '취재 종합' 언론사",
              "section_reporter_title":"이번 주 가장 많이 '취재 종합'한 기자",
              "section_category_title":"원문 기사 분류",
              "section_secondary_title":"함께 쓰인 무주체형 표현",
              "section_history_title":"최근 14일",
              "section_articles_title":"오늘의 '취재 종합' 문장들",
          }
          for name,title in expected.items():
              assert cfg[name]==title,(name,cfg[name])
          for key,node_id in (("group_usage_title","usageGroupTitle"),("group_analysis_title","analysisGroupTitle")):
              assert cfg.get(key),key
              assert key+':' in admin,key
              assert f'id="{node_id}"' in html,node_id
              assert f'#{node_id}' in js,node_id
          assert 'editorial-blue-2' in html
          assert 'class="dashboard-group usage-group"' in html
          assert 'class="dashboard-group analysis-group"' in html
          assert 'id="summaryCards"' in html
          for token in ['.card:first-child','.group-heading','.phrase-highlight','.day:last-child .vbar','@media(max-width:540px)']:
              assert token in css,token
          class Validator(HTMLParser):
              pass
          Validator().feed(html)
          print("Editorial copy, layout and responsive styling checks passed")
          PY
          node - <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const document={
            addEventListener(){},
            createTextNode(text){return {type:"text",text}},
            createElement(tag){return {type:tag,textContent:"",className:""}},
          };
          const ctx={document};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("api/static/app.js","utf8"),ctx);
          const parent={children:[],appendChild(x){this.children.push(x)}};
          vm.runInContext('highlightTargetPhrases',ctx)(parent,'뉴스 취재를 종합하면 <img src=x> 본지 취재결과 2건');
          assert.equal(parent.children.filter(x=>x.type==="mark").length,2);
          assert.equal(parent.children.map(x=>x.type==="text"?x.text:x.textContent).join(""),'뉴스 취재를 종합하면 <img src=x> 본지 취재결과 2건');
          assert(parent.children.some(x=>x.type==="text"&&x.text.includes("<img")));
          console.log("Safe search-expression highlighting checks passed");
          JS
      - name: Verify simplified article view and ranking dialogs
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          main=Path("api/main.py").read_text()
          tree=ast.parse(main)
          cfg=ast.literal_eval(next(n for n in tree.body if isinstance(n,ast.Assign)
            and any(isinstance(t,ast.Name) and t.id=="DEFAULT_SITE_CONFIG" for t in n.targets)).value)
          assert cfg["ranking_view_all_text"]=="자세히 보기"
          assert 'if config.get("ranking_view_all_text") == "전체 보기"' in main
          html=Path("api/static/index.html").read_text()
          app=Path("api/static/app.js").read_text()
          css=Path("api/static/style.css").read_text()
          assert '<div class="chips"></div>' not in html
          assert 'node.querySelector(".chips")' not in app
          assert 'a.is_exclusive' not in app.split('function articleNode(a,cfg){')[1].split('function renderArticles()')[0]
          assert 'links.push(`<a' in app
          assert 'if(a.naver_url) links.push' in app
          assert 'esc(cfg.naver_link_text)' in app
          for target in ("publisherRanking","reporterRanking","secondaryRanking"):
              assert f'data-target="{target}"' in html
          for target in ("rankingDialog","rankingDialogTitle","rankingDialogContent","rankingDialogMore","closeRankingDialog"):
              assert f'id="{target}"' in html
          assert 'ranking-dialog.js' in html
          assert '.hero::before,.hero::after{display:none}' in css
          assert "openRankingDialog(id)" in app
          assert "showMoreRankingDialog" in app
          assert 'data-target="categoryRanking"' in html
          print("Simple article view and ranking dialog contract validated")
          PY
          node - <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const elements=new Map();
          function element(k){
            if(!elements.has(k))elements.set(k,{innerHTML:"",textContent:"",hidden:false,style:{},open:false,showModal(){this.open=true},close(){this.open=false}});
            return elements.get(k);
          }
          const context={
            qs:element,
            esc:(x)=>String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"),
            state:{data:{site_config:{
              section_publisher_title:"언론사",section_reporter_title:"기자",
              section_secondary_title:"무주체형 표현",articles_more_text:"더 보기",
            },publisher_ranking:Array.from({length:45},(_,i)=>({name:"신문"+(i+1),count:45-i})),
              reporter_ranking_week:[
                {name:"가",publisher:"언론사A",count:2},
                {name:"나",publisher:"언론사B",count:10},
                {name:"다",publisher:"언론사A",count:1},
                {name:"라",publisher:"언론사A",count:3},
                {name:"마",publisher:"언론사B",count:5},
              ],
              secondary_expressions:Array.from({length:29},(_,i)=>({name:"표현"+i,count:29-i})),
            }},
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync("api/static/ranking-dialog.js","utf8"),context);
          const group=vm.runInContext('groupReportersByPublisher',context);
          const groups=group(context.state.data.reporter_ranking_week);
          assert.equal(groups[0].publisher,"언론사A");
          assert.equal(groups[0].members.length,3);
          const open=vm.runInContext('openRankingDialog',context);
          const more=vm.runInContext('showMoreRankingDialog',context);
          open("publisherRanking");
          assert(element("#rankingDialog").open);
          assert.equal((element("#rankingDialogContent").innerHTML.match(/ranking-dialog-row/g)||[]).length,20);
          assert.equal(element("#rankingDialogMore").hidden,false);
          more();
          assert.equal((element("#rankingDialogContent").innerHTML.match(/ranking-dialog-row/g)||[]).length,40);
          more();
          assert.equal((element("#rankingDialogContent").innerHTML.match(/ranking-dialog-row/g)||[]).length,45);
          assert.equal(element("#rankingDialogMore").hidden,true);
          open("secondaryRanking");
          assert.equal((element("#rankingDialogContent").innerHTML.match(/ranking-dialog-row/g)||[]).length,20);
          more();
          assert.equal((element("#rankingDialogContent").innerHTML.match(/ranking-dialog-row/g)||[]).length,29);
          open("reporterRanking");
          const grouped=element("#rankingDialogContent").innerHTML;
          assert(grouped.indexOf("언론사A")<grouped.indexOf("언론사B"));
          assert.equal((grouped.match(/ranking-dialog-row/g)||[]).length,5);
          assert.equal(element("#rankingDialogMore").hidden,true);
          console.log("Ranking pagination 20/40/45, 20/29 and grouping validated");
          JS
      - name: Verify publisher admin editor and Naver link restoration
        run: |
          python - <<'PY'
          from pathlib import Path
          api=Path("api/main.py").read_text()
          app=Path("api/static/app.js").read_text()
          index=Path("api/static/index.html").read_text()
          html=Path("api/static/admin.html").read_text()
          adminjs=Path("api/static/publisher-editor.js").read_text()
          for endpoint in ('@app.get("/api/admin/publishers")','@app.put("/api/admin/publishers")'):
              assert endpoint in api
          assert 'publisher_aliases = get_publisher_aliases()' in api
          assert 'publisher_display(a, publisher_aliases)' in api
          assert 'publisher_display(article, publisher_aliases)' in api
          assert 'get_publisher_aliases()' in api
          assert 'id="publisherSearch"' in html
          assert 'id="publisherRows"' in html
          assert 'id="savePublishers"' in html
          assert "publisher-editor.js" in html
          assert "X-Admin-Password" in adminjs
          assert "publisherEditor.visible+=50" in adminjs
          assert 'if(a.naver_url) links.push' in app
          assert "esc(cfg.naver_link_text)" in app
          assert "/static/app.js?v=editorial-blue-3" in index
          print("Publisher alias admin and Naver link contract passed")
          PY
          node - <<'JS'
          const fs=require("node:fs"),vm=require("node:vm"),assert=require("node:assert/strict");
          const ctx={document:{addEventListener(){}}};
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync("api/static/publisher-editor.js","utf8"),ctx);
          const escapeHtml=vm.runInContext('escapePublisherHtml',ctx);
          assert.equal(escapeHtml('<img src=x onerror="bad">'),'&lt;img src=x onerror=&quot;bad&quot;&gt;');
          const rows=vm.runInContext('publisherEditor',ctx);
          rows.items=[
            {source:"KBS 뉴스",display_name:"KBS 뉴스",default_name:"KBS 뉴스",draft:"KBS",article_count:3},
            {source:"이투데이",display_name:"이투데이",default_name:"이투데이",draft:"이투데이",article_count:1},
          ];
          assert.equal(vm.runInContext('changedPublisherItems',ctx)().length,1);
          console.log("Admin label safety and changed-row detection passed");
          JS
      - name: Markup and API contract checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          src = Path("api/main.py").read_text()
          ast.parse(src)
          html = Path("api/static/index.html").read_text()
          js = Path("api/static/app.js").read_text()
          for key in ["categoryDialog", "clearTopicFilter", "categoryRanking", "articleTemplate", "collectionHealth"]:
              assert f'id="{key}"' in html, key
          for key in ["paragraph-details", "about-link"]:
              assert key in html, key
          assert "topic-details" not in html
          assert "categoryCoverage" not in html
          assert "category_primary_ranking" in src
          assert "category_hierarchy" in src
          assert "additional_phrase_article_count" in src
          assert '"about_body": ""' in src
          assert 'id="aboutContent"' in Path("api/static/about.html").read_text()
          assert 'topic-dialog.js' in html
          assert 'href="/about"' in html
          assert Path("api/static/about.html").exists()
          assert '@app.get("/about")' in src
          assert "paper-table3-v2" in src
          for key in ["category_ranking_ai", "category_classified_count", "category_unclassified_count", "category_primary", "category_secondary", "category_tertiary"]:
              assert key in src, key
          assert 'CLASSIFY_FORCE=false' in Path(".github/workflows/run-classifier.yml").read_text()
          print("Dashboard contract checks passed")
          PY
