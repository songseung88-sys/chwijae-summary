name: Verify subjectless dashboard live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-subjectless-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public dashboard and about route
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base="https://chwijae-api-ejmdmrnztq-du.a.run.app"
          def get(path):
              with urlopen(base+path,timeout=25) as response:
                  return response.read()

          data=json.loads(get("/api/dashboard").decode("utf-8"))
          print("DATE",data["date"])
          print("TODAY",data["today_count"])
          print("LATEST_COLLECTION",json.dumps(data.get("last_successful_collection"),ensure_ascii=False))
          print("METHODOLOGY",json.dumps(data.get("secondary_methodology"),ensure_ascii=False))
          labels=[x["name"] for x in data.get("secondary_expressions",[])]
          print("EXPRESSIONS",json.dumps(data.get("secondary_expressions",[]),ensure_ascii=False))
          assert data.get("secondary_methodology",{}).get("version")=="paper-table3-v2"
          assert not set(labels).intersection({"한 셈이다","취재를 종합하면","본지 취재 결과"}), labels
          assert 0<=data["additional_phrase_article_count"]<=data["today_count"]
          assert "category_primary_ranking" in data and "category_hierarchy" in data
          total=sum(r["count"] for r in data["category_primary_ranking"])
          assert total==sum(row["count"] for row in data["category_hierarchy"])
          for node in data["category_hierarchy"]:
              assert node["count"]==sum(row["count"] for row in node["secondaries"])
          print("ADDITIONAL_PHRASE_ARTICLES",data["additional_phrase_article_count"])
          print("PRIMARY",json.dumps(data["category_primary_ranking"],ensure_ascii=False))

          home=get("/").decode("utf-8")
          about=get("/about").decode("utf-8")
          js=get("/static/app.js").decode("utf-8")
          topic_js=get("/static/topic-dialog.js").decode("utf-8")
          about_js=get("/static/about.js").decode("utf-8")
          public_cfg=json.loads(get("/api/config").decode("utf-8"))
          assert 'href="/about"' in home
          assert 'id="aboutContent"' in about
          assert 'id="categoryDialog"' in home
          assert 'categoryCoverage' not in home
          assert "about_body" in public_cfg
          assert 'showModal()' in topic_js
          assert 'textContent' in about_js
          assert "chips.push(a.category_secondary" not in js
          assert 'Object.entries(a.secondary_expressions' not in js
          assert "정상 갱신" not in js and "해당 실행 신규" not in js
          # Live editorial-blue deployment and editability contract.
          css=get("/static/style.css?v=editorial-blue-3").decode("utf-8")
          editorial_js=get("/static/app.js?v=editorial-blue-3").decode("utf-8")
          admin_js=get("/static/admin.js").decode("utf-8")
          assert "editorial-blue-3" in home
          for element in ['id="usageGroupTitle"','id="analysisGroupTitle"','id="summaryCards"']:
              assert element in home,element
          for k in ("group_usage_title","group_analysis_title"):
              assert public_cfg.get(k),k
              assert k in admin_js,k
              assert k in editorial_js,k
          assert ".phrase-highlight" in css
          assert ".card:first-child" in css
          assert "highlightTargetPhrases" in editorial_js
          assert "LIVE_DASHBOARD_VALIDATED" not in home
          # Rank details and minimal article list are served by the deployed API.
          ranking_js=get("/static/ranking-dialog.js?v=ranking-details-1").decode("utf-8")
          assert 'id="rankingDialog"' in home
          assert 'id="rankingDialogMore"' in home
          assert '<div class="chips"></div>' not in home
          assert "node.querySelector(\".chips\")" not in editorial_js
          assert 'if(a.naver_url) links.push' in editorial_js
          assert 'esc(cfg.naver_link_text)' in editorial_js
          admin_html=get("/admin").decode("utf-8")
          publisher_editor=get("/static/publisher-editor.js?v=publisher-aliases-1").decode("utf-8")
          assert 'id="publisherSearch"' in admin_html
          assert 'id="publisherRows"' in admin_html
          assert 'id="savePublishers"' in admin_html
          assert "X-Admin-Password" in publisher_editor
          assert "loadPublisherNames" in publisher_editor
          assert "openRankingDialog(id)" in editorial_js
          assert 'rankingDialogState.visible=20' in ranking_js
          assert 'groupReportersByPublisher' in ranking_js
          assert ".hero::before,.hero::after{display:none}" in css
          assert public_cfg.get("ranking_view_all_text")=="자세히 보기"
          print("EDITORIAL_BLUE_LIVE_VALIDATED")
          print("LIVE_DASHBOARD_VALIDATED")
          PY
