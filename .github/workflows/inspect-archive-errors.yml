name: Inspect archive job runtime errors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-archive-errors.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: chwijae-summary
          workload_identity_provider: projects/761297976744/locations/global/workloadIdentityPools/github/providers/chwijae-summary
          service_account: github-deployer@chwijae-summary.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read archive Cloud Run stdout and stderr
        run: |
          gcloud logging read             'resource.type="cloud_run_job" AND resource.labels.job_name="chwijae-daily-archive"'             --project=chwijae-summary --freshness=2h --limit=80             --format='table(timestamp,severity,textPayload,jsonPayload.message)' || true
      - name: Describe failed execution
        run: |
          gcloud run jobs executions describe chwijae-daily-archive-hws5g             --project=chwijae-summary --region=asia-northeast3             --format=json || true
